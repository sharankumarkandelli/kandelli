<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anand Raju ❤️ Prema Kumari - Wedding Invitation</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #12000d, #35001d, #090014);
            color: white;
        }

        /* Main container */
        .wedding-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            position: relative;
            overflow: hidden;
        }

        /* Animated glowing background */
        .glow {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(255, 0, 102, 0.18);
            filter: blur(80px);
            animation: glowMove 6s infinite alternate ease-in-out;
        }

        .glow1 {
            top: -100px;
            left: -100px;
        }

        .glow2 {
            bottom: -100px;
            right: -100px;
            background: rgba(255, 80, 150, 0.18);
            animation-delay: 2s;
        }

        @keyframes glowMove {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.5);
            }
        }

        /* Invitation card */
        .invitation-card {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 850px;
            padding: 50px 30px;
            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;

            backdrop-filter: blur(15px);
            box-shadow:
                0 0 30px rgba(255, 0, 100, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.05);

            animation: cardAppear 2s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(60px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Top text */
        .welcome {
            font-size: 18px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #ffd6e8;
            margin-bottom: 15px;
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(45px, 8vw, 85px);
            color: #fff;
            text-shadow:
                0 0 10px #ff4f9a,
                0 0 25px #ff1681;
            animation: titleGlow 2s infinite alternate;
        }

        @keyframes titleGlow {
            from {
                text-shadow: 0 0 10px #ff4f9a;
            }

            to {
                text-shadow:
                    0 0 20px #ff4f9a,
                    0 0 40px #ff1681;
            }
        }

        .couple {
            margin-top: 20px;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(38px, 7vw, 70px);
            color: #ffb6d5;
        }

        .heart-main {
            display: inline-block;
            color: #ff277f;
            font-size: 65px;
            margin: 15px;
            animation: heartbeat 1.2s infinite;
            text-shadow: 0 0 25px #ff0066;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.25);
            }

            50% {
                transform: scale(1);
            }

            75% {
                transform: scale(1.18);
            }
        }

        .date {
            font-size: 28px;
            font-weight: 600;
            color: #ffe3ef;
            margin-top: 20px;
        }

        .details {
            display: none;
            margin-top: 30px;
            animation: detailsAppear 1s ease;
        }

        @keyframes detailsAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .detail-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin: 12px auto;
            max-width: 550px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .detail-box h4 {
            color: #ff8fbd;
            margin-bottom: 5px;
        }

        .detail-box p {
            font-size: 20px;
            margin: 0;
        }

        /* Button */
        .open-btn {
            margin-top: 25px;
            padding: 13px 35px;
            border: none;
            border-radius: 50px;

            background: linear-gradient(45deg, #ff0066, #ff4f9a);
            color: white;
            font-size: 18px;
            font-weight: 600;

            box-shadow: 0 0 20px rgba(255, 0, 102, 0.6);
            transition: 0.3s;
        }

        .open-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 0, 102, 0.9);
        }

        /* Floating hearts */
        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: #ff3d91;
            font-size: 25px;
            opacity: 0.8;
            animation: floatHeart linear infinite;
            pointer-events: none;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Footer */
        .footer {
            margin-top: 35px;
            color: #ffc9df;
            font-size: 15px;
        }

        @media (max-width: 576px) {
            .invitation-card {
                padding: 35px 18px;
            }

            .welcome {
                font-size: 13px;
            }

            .date {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="wedding-container">

    <!-- Background glow -->
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <!-- Invitation Card -->
    <div class="invitation-card">

        <div class="welcome">
            You Are Cordially Invited
        </div>

        <div class="title">
            Wedding Invitation
        </div>

        <div class="heart-main">
            ❤️
        </div>

        <div class="couple">
            ANAND RAJU
            <br>
            <span style="font-size:35px;">&
                <span class="heart-small">♥</span>
            </span>
            <br>
            PREMA KUMARI
        </div>

        <div class="date">
            25 / 05 / 2001
        </div>

        <button class="open-btn" onclick="openInvitation()">
            💌 Click Here to Open Invitation
        </button>

        <!-- Hidden Details -->
        <div class="details" id="details">

            <div class="detail-box">
                <h4>💑 Wedding Couple</h4>
                <p>ANAND RAJU ❤️ PREMA KUMARI</p>
            </div>

            <div class="detail-box">
                <h4>📅 Wedding Date</h4>
                <p>25 / 05 / 2001</p>
            </div>

            <div class="detail-box">
                <h4>⏰ Wedding Time</h4>
                <p>12:00</p>
            </div>

            <div class="detail-box">
                <h4>📍 Wedding Place</h4>
                <p>Kakiluru</p>
            </div>

            <div class="footer">
                💕 Two hearts, one beautiful journey 💕
                <br>
                With love and blessings
            </div>

        </div>

    </div>

</div>

<script>

    // Open invitation
    function openInvitation() {

        const details = document.getElementById("details");
        const button = document.querySelector(".open-btn");

        if (details.style.display === "block") {

            details.style.display = "none";
            button.innerHTML = "💌 Click Here to Open Invitation";

        } else {

            details.style.display = "block";
            button.innerHTML = "💖 Hide Invitation";

        }
    }


    // Create floating hearts
    function createHeart() {

        const heart = document.createElement("div");

        heart.classList.add("floating-heart");

        heart.innerHTML = "♥";

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.fontSize =
            (15 + Math.random() * 35) + "px";

        heart.style.animationDuration =
            (5 + Math.random() * 7) + "s";

        heart.style.animationDelay =
            Math.random() * 2 + "s";

        document.querySelector(".wedding-container")
            .appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 12000);
    }


    // Continuously create hearts
    setInterval(createHeart, 500);


    // Initial hearts
    for (let i = 0; i < 15; i++) {
        setTimeout(createHeart, i * 300);
    }

</script>

</body>
</html>
